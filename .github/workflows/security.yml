name: security
on: [push, pull_request]

jobs:
  Secret-Scan:
    name: Secret scan (Gitleaks) 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   
      - name: Gitleaks     
        run: |
          docker run -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --exit-code 1

  SAST:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep
        run: |
          pip install semgrep
          semgrep scan --config auto --error    # drop --error to make it a report

  Dependency-Check:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy
        run: |
          docker run -v "${{ github.workspace }}:/repo" aquasec/trivy:latest \
            fs --scanners vuln --exit-code 0 /repo
